services:
  web-dev:
    platform: linux/amd64
    build:
      context: .
      dockerfile: AIMS/Dockerfile.dev
    ports:
      - "${WEB_PORT}:5119"
    volumes:
      - .:/src/
      - ./seed:/src/AIMS/seed:ro
      - aims_bin:/src/AIMS/bin
      - aims_obj:/src/AIMS/obj
    environment:
      # --- ASP.NET / .NET runtime toggles (Development) ---
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT}
      DOTNET_USE_POLLING_FILE_WATCHER: "${DOTNET_USE_POLLING_FILE_WATCHER}"
      ASPNETCORE_URLS: "${ASPNETCORE_URLS}"
      DOTNET_CLI_TELEMETRY_OUTPUT: "${DOTNET_CLI_TELEMETRY_OUTPUT}"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "${DOTNET_WATCH_RESTART_ON_RUDE_EDIT}"
      DOTNET_WATCH_SUPPRESS_EMOJI: "${DOTNET_WATCH_SUPPRESS_EMOJI}"

      # --- Connection strings ---
      ConnectionStrings__Default: "Server=${SQL_HOST},${SQL_PORT};Database=${SQL_DB};User Id=${SQL_USER};Password=${SQL_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      ConnectionStrings__DockerConnection: "Server=${SQL_HOST},${SQL_PORT};Database=${SQL_DB};User Id=${SQL_USER};Password=${SQL_PASSWORD};TrustServerCertificate=True;Encrypt=False"

      # --- Azure AD (new AIMS__ keys) ---
      AIMS__AzureAd__Instance: "${AIMS__AzureAd__Instance}"
      AIMS__AzureAd__TenantId: "${AIMS__AzureAd__TenantId}"
      AIMS__AzureAd__ClientId: "${AIMS__AzureAd__ClientId}"
      AIMS__AzureAd__CallbackPath: "${AIMS__AzureAd__CallbackPath}"

      # Secret loaded from Docker secret mount
      AIMS__AzureAd__ClientSecretFile: "/src/AIMS/secrets/azuread_client_secret.txt"

      # --- Seeder controls ---
      AIMS_SEED_MODE: ${AIMS_SEED_MODE:-basic}
      AIMS_SEED_DIR: ${AIMS_SEED_DIR:-/src/seed}
      AIMS_ALLOW_PROD_SEED: ${AIMS_ALLOW_PROD_SEED:-false}

    secrets:
      - azuread_client_secret

    depends_on:
      sqlserver-dev:
        condition: service_healthy

    networks:
      - new-bridge-net

  sqlserver-dev:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    ports:
      - "${SQL_PORT_HOST}:${SQL_PORT}"          
    environment:
      SA_PASSWORD: "${SQL_PASSWORD}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./sql:/sql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -No -Q \"SELECT 1\" -C"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 45s
    restart: unless-stopped
    networks:
      - new-bridge-net

secrets:
  azuread_client_secret:
    file: ./secrets/azuread_client_secret.txt

networks:
  new-bridge-net:
    driver: bridge

volumes:
  mssql_data:
  aims_bin:
  aims_obj:

